# Send the error log to syslogd so it is capped by its rotation instead of
# growing unbounded on /var/log. This overrides the server.errorlog file set
# in lighttpd.annotated.conf.
server.errorlog-use-syslog = "enable"

# With the error log on syslog, lighttpd points CGI stderr at /dev/null.
# Pipe it to syslog instead so upload.cgi etc. failures are still visible.
server.breakagelog = "|/usr/bin/logger -t lighttpd-cgi"
