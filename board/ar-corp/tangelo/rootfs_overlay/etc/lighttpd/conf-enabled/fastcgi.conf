# /usr/share/doc/lighttpd/fastcgi.txt.gz
# http://redmine.lighttpd.net/projects/lighttpd/wiki/Docs:ConfigurationOptions#mod_fastcgi-fastcgi

server.modules += ( "mod_fastcgi" )

# arsystem is the authorizer for every API and CGI request (accounts and
# roles, TANGELO_ENABLE_AUTH): lighttpd asks it first and sends its refusal
# instead, before any request body is read. It also answers /api/system and
# the account routes (/api/login, /api/logout, /api/users[...]).
fastcgi.server = (
  "/api/"       => (( "socket" => "/run/arsystem/fcgi.sock", "check-local" => "disable", "mode" => "authorizer" )),
  "/cgi-bin/"   => (( "socket" => "/run/arsystem/fcgi.sock", "check-local" => "disable", "mode" => "authorizer" )),
  "/api/system" => (( "socket" => "/run/arsystem/fcgi.sock", "check-local" => "disable" )),
  "/api/login"  => (( "socket" => "/run/arsystem/fcgi.sock", "check-local" => "disable" )),
  "/api/logout" => (( "socket" => "/run/arsystem/fcgi.sock", "check-local" => "disable" )),
  "/api/users"  => (( "socket" => "/run/arsystem/fcgi.sock", "check-local" => "disable" ))
)

server.modules += ( "mod_proxy" )

$HTTP["url"] =~ "^/api/fpga" {
  proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8000 )))
}

