# HTTPS on 443 and the plain-HTTP switch (/api/system/network/http); see
# etc/lighttpd/tls.sh. A missing key pair leaves plain HTTP serving rather
# than keeping the web server from starting.
include_shell "/etc/lighttpd/tls.sh"

# HTTP/1.1 only, h2 and h2c off: mongoose pads Content-Length with trailing
# spaces, which HTTP/2 forbids, so every proxied tangelo reply failed over h2.
server.feature-flags += ( "server.h2proto" => "disable" )
