# lighttpd serves /api/system straight from arsystem's FastCGI socket, so those
# URIs never reach tangelo and its own auth gate cannot cover them. tangelo
# generates the block below (and the credential file it names) at startup and on
# every password change. It is EMPTY unless authentication is switched on via
# PUT /api/auth, so with authentication off this file changes nothing. tangelo
# is S46, lighttpd S50, so it is always current when the server reads it. (#58)
# `|| true` is load-bearing: include_shell treats a non-zero exit as a fatal
# config error, so a missing file -- an older tangelo, a wiped /var/lib, a
# tangelo that died before writing it -- would stop lighttpd starting at all.
# Note a SIGUSR1 graceful restart re-parses all of this in the already
# privilege-dropped process, so the cat runs as www-data, not root: tangelo
# keeps the generated file 0640 root:www-data for that reason.
include_shell "cat /var/lib/tangelo/lighttpd-auth.conf 2>/dev/null || true"
