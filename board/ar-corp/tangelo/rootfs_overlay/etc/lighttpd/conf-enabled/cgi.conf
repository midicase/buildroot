server.modules += ( "mod_cgi" )

$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
        # Send CGI output as it is produced rather than buffering the whole
        # response (the default), so the firmware upload progress ticks reach
        # the browser while the extract is still running. Scoped to /cgi-bin/
        # so the API proxy paths keep their existing buffering.
        server.stream-response-body = 2
}

