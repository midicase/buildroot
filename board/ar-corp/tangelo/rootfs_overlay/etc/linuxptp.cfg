# IEEE 1588 default profile, per the client 2026-08-13. Overrides the linuxptp
# package's copy: that one still uses the slaveOnly keyword, deprecated in 4.4,
# and leaves the delay mechanism to autodetect.
#
# The multicast group (224.0.1.129) and ports (319/320) are fixed by the standard
# and are not configurable. udp_ttl defaults to 1, so the grandmaster must share
# an L2 segment with ETH1 or reach us through a boundary clock.
[global]
clientOnly              1
domainNumber            0
network_transport       UDPv4
delay_mechanism         E2E
time_stamping           hardware
step_threshold          1.0
[eth0]
